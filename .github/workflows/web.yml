name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "backend/api/openapi.yaml", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "backend/api/openapi.yaml", ".github/workflows/web.yml"]

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the dashboard and the API must not drift: types come from backend/api/openapi.yaml
      - name: API types match openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts || { echo "run: cd web && npm run gen:api"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
