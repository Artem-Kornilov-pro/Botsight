name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "ai/**", "migrations/**", "deploy/**", "docs/contract/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "ai/**", "migrations/**", "deploy/**", "docs/contract/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      # integration tests start PostgreSQL, Redis, Kafka and ClickHouse with testcontainers
      - run: go test -race -timeout 15m ./...

  # The whole data path in docker compose: loadgen -> collector -> Kafka -> ch-writer
  # -> ClickHouse, then every accepted event must be in ClickHouse exactly once.
  e2e:
    runs-on: ubuntu-latest
    env:
      AI_TOPICS_INTERVAL_SECONDS: "60" # topics within a minute instead of an hour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: start the local environment
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: services are ready
        run: |
          for i in $(seq 1 90); do
            curl -fsS localhost:8080/readyz && curl -fsS localhost:8081/readyz && curl -fsS localhost:8082/readyz && curl -fsS localhost:8090/readyz && exit 0
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - name: load
        working-directory: backend
        run: go run ./cmd/loadgen -projects 5 -users 500 -rate 5000 -duration 20s -concurrency 8 -duplicates 0.05 -texts -journal /tmp/journal.txt | tee /tmp/loadgen.txt
      - name: every accepted event is in ClickHouse exactly once
        run: |
          ids=$(grep -o "IN ([0-9,]*)" /tmp/loadgen.txt)
          expected=$(( $(wc -l < /tmp/journal.txt) ))  # arithmetic drops the padding some wc versions add
          q="SELECT count(), uniqExact(event_id) FROM events WHERE project_id $ids FORMAT TSV"
          for i in $(seq 1 60); do
            read rows unique < <(curl -fsS "localhost:8123/?user=botsight&password=botsight&database=botsight" --data-binary "$q")
            echo "rows=$rows unique=$unique expected=$expected"
            [ "$rows" = "$expected" ] && [ "$unique" = "$expected" ] && exit 0
            sleep 2
          done
          exit 1
      - name: ai-worker builds topics from the message texts
        run: |
          ids=$(grep -o "IN ([0-9,]*)" /tmp/loadgen.txt)
          q="SELECT count(DISTINCT project_id), count() FROM topics FINAL WHERE active = 1 AND project_id $ids FORMAT TSV"
          for i in $(seq 1 60); do
            read projects topics < <(curl -fsS "localhost:8123/?user=botsight&password=botsight&database=botsight" --data-binary "$q")
            echo "projects with topics=$projects topics=$topics"
            [ "$projects" = "5" ] && [ "$topics" -ge 15 ] && exit 0
            sleep 5
          done
          exit 1
      - name: logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 200
      - name: stop
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
