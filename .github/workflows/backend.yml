name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "migrations/**", "deploy/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "migrations/**", "deploy/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      # integration tests start PostgreSQL and Redis with testcontainers
      - run: go test -race ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: start the local environment
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: api is ready after migrations
        run: |
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/readyz && exit 0
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - name: stop
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
