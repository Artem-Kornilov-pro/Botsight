name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "ai/**", "migrations/**", "deploy/**", "docs/contract/**", "web/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "ai/**", "migrations/**", "deploy/**", "docs/contract/**", "web/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      # integration tests start PostgreSQL, Redis, Kafka and ClickHouse with testcontainers
      - run: go test -race -timeout 15m ./...

  # The whole data path in docker compose: loadgen -> collector -> Kafka -> ch-writer
  # -> ClickHouse, then every accepted event must be in ClickHouse exactly once.
  e2e:
    runs-on: ubuntu-latest
    env:
      AI_TOPICS_INTERVAL_SECONDS: "60" # topics within a minute instead of an hour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: start the local environment
        # Docker Hub sometimes answers 502 on pulls: up is idempotent, so it is retried
        run: |
          for i in 1 2 3 4; do
            docker compose -f deploy/docker-compose.yml up -d --build && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: services are ready
        run: |
          for i in $(seq 1 90); do
            curl -fsS localhost:8080/readyz && curl -fsS localhost:8081/readyz && curl -fsS localhost:8082/readyz && curl -fsS localhost:8083/readyz && curl -fsS localhost:8090/readyz && exit 0
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - name: load
        working-directory: backend
        run: go run ./cmd/loadgen -projects 5 -users 500 -rate 5000 -duration 20s -concurrency 8 -duplicates 0.05 -texts -fraud 0.2 -journal /tmp/journal.txt | tee /tmp/loadgen.txt
      - name: every accepted event is in ClickHouse exactly once
        run: |
          ids=$(grep -o "IN ([0-9,]*)" /tmp/loadgen.txt)
          expected=$(( $(wc -l < /tmp/journal.txt) ))  # arithmetic drops the padding some wc versions add
          q="SELECT count(), uniqExact(event_id) FROM events WHERE project_id $ids FORMAT TSV"
          for i in $(seq 1 60); do
            read rows unique < <(curl -fsS "localhost:8123/?user=botsight&password=botsight&database=botsight" --data-binary "$q")
            echo "rows=$rows unique=$unique expected=$expected"
            [ "$rows" = "$expected" ] && [ "$unique" = "$expected" ] && exit 0
            sleep 2
          done
          exit 1
      - name: monitoring sees every service, SLO rules and dashboards are loaded
        run: |
          for i in $(seq 1 30); do
            down=$(curl -fsS localhost:9090/api/v1/targets | jq '[.data.activeTargets[] | select(.health != "up")] | length')
            echo "targets down: $down"
            [ "$down" = "0" ] && break
            sleep 2
          done
          [ "$down" = "0" ] || { curl -fsS localhost:9090/api/v1/targets | jq '.data.activeTargets[] | {job: .labels.job, health, lastError}'; exit 1; }
          rules=$(curl -fsS localhost:9090/api/v1/rules | jq '[.data.groups[].rules[]] | length')
          echo "rules: $rules"; [ "$rules" -ge 15 ]
          dashboards=$(curl -fsS 'localhost:3000/api/search?tag=botsight' | jq length)
          echo "dashboards: $dashboards"; [ "$dashboards" = "3" ]
          # SLO "freshness": after loadgen, p95 from Kafka to ClickHouse is under 10 s
          for i in $(seq 1 30); do
            fresh=$(curl -fsS localhost:9090/api/v1/query --data-urlencode 'query=botsight:freshness_p95:5m' | jq -r '.data.result[0].value[1] // empty')
            echo "freshness p95: ${fresh:-none}"
            [ -n "$fresh" ] && awk -v f="$fresh" 'BEGIN { exit !(f < 10) }' && exit 0
            sleep 5
          done
          exit 1
      - name: ai-worker builds topics from the message texts
        run: |
          ids=$(grep -o "IN ([0-9,]*)" /tmp/loadgen.txt)
          q="SELECT count(DISTINCT project_id), count() FROM topics FINAL WHERE active = 1 AND project_id $ids FORMAT TSV"
          for i in $(seq 1 60); do
            read projects topics < <(curl -fsS "localhost:8123/?user=botsight&password=botsight&database=botsight" --data-binary "$q")
            echo "projects with topics=$projects topics=$topics"
            [ "$projects" = "5" ] && [ "$topics" -ge 15 ] && exit 0
            sleep 5
          done
          exit 1
      - name: antifraud finds the injected farms and spares people
        run: |
          ids=$(grep -o "IN ([0-9,]*)" /tmp/loadgen.txt)
          q="SELECT if(sumIf(users, bot) = 0, -1, sumIf(suspicious, bot) / sumIf(users, bot)),
                    if(sumIf(users, NOT bot) = 0, -1, sumIf(suspicious, NOT bot) / sumIf(users, NOT bot))
             FROM (SELECT source = 'promo_farm' OR startsWith(source, 'ref_') AS bot, users, suspicious
                   FROM source_risk FINAL WHERE project_id $ids AND (project_id, updated_at) IN
                   (SELECT project_id, max(updated_at) FROM source_risk WHERE project_id $ids GROUP BY project_id)) FORMAT TSV"
          for i in $(seq 1 36); do
            read recall false_positive < <(curl -fsS "localhost:8123/?user=botsight&password=botsight&database=botsight" --data-binary "$q")
            echo "bots flagged=$recall people flagged=$false_positive"
            awk -v r="$recall" -v f="$false_positive" 'BEGIN { exit !(r + 0 >= 0.9 && f + 0 >= 0 && f + 0 <= 0.02) }' && exit 0
            sleep 5
          done
          exit 1
      - name: analytics API answers on the loadgen data
        run: |
          account=$(grep -o 'account [^,]*' /tmp/loadgen.txt | cut -d' ' -f2)
          pid=$(grep -o "IN ([0-9,]*)" /tmp/loadgen.txt | grep -o '[0-9][0-9]*' | head -1)
          csrf=$(curl -fsS -c /tmp/jar -H 'Content-Type: application/json' \
            -d "{\"email\":\"$account\",\"password\":\"loadgen-password\"}" localhost:8080/v1/auth/login | jq -r .csrf_token)
          api="localhost:8080/v1/projects/$pid"
          curl -fsS -b /tmp/jar "$api/overview" | jq -e '.users > 0 and .updates > 0 and (.days | length) == 30'
          curl -fsS -b /tmp/jar -H 'Content-Type: application/json' -H "X-CSRF-Token: $csrf" \
            -d '{"definition":{"steps":[{"kind":"command","value":"start"},{"kind":"state","value":"Form:lab"},{"kind":"state","value":"Form:name"}],"breakdown":"source"}}' \
            "$api/funnels/query" | jq -e '.steps[0].users > 0 and .steps[1].users > 0 and (.breakdown | length) > 1'
          curl -fsS -b /tmp/jar "$api/sources?goal=custom:purchase" | jq -e '(.sources | length) > 1'
          curl -fsS -b /tmp/jar "$api/fsm-graph" | jq -e '(.edges | length) > 0'
          curl -fsS -b /tmp/jar "$api/errors" | jq -e '.api | length >= 0'
          curl -fsS -b /tmp/jar "$api/retention?weeks=2" | jq -e '.cohorts[0].users > 0'
      - name: live stream shows events as they arrive
        run: |
          account=$(grep -o 'account [^,]*' /tmp/loadgen.txt | cut -d' ' -f2)
          pid=$(grep -o "IN ([0-9,]*)" /tmp/loadgen.txt | grep -o '[0-9][0-9]*' | head -1)
          csrf=$(curl -fsS -c /tmp/jar2 -H 'Content-Type: application/json' \
            -d "{\"email\":\"$account\",\"password\":\"loadgen-password\"}" localhost:8080/v1/auth/login | jq -r .csrf_token)
          key=$(curl -fsS -b /tmp/jar2 -H 'Content-Type: application/json' -H "X-CSRF-Token: $csrf" \
            -d '{"name":"live"}' "localhost:8080/v1/projects/$pid/keys" | jq -r .key)
          curl -sN -b /tmp/jar2 --max-time 25 "localhost:8080/v1/projects/$pid/live" > /tmp/live.txt &
          sleep 3
          (cd backend && go run ./cmd/loadgen -keys "$key" -users 50 -rate 200 -duration 5s)
          wait || true
          grep -c '^event: event' /tmp/live.txt
          grep -q '^event: ready' /tmp/live.txt && grep -q '^event: event' /tmp/live.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: dashboard end-to-end (Playwright against the running stack)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:4173 > /dev/null && break; sleep 1; done
          E2E_EMAIL=$(grep -o 'account [^,]*' /tmp/loadgen.txt | cut -d' ' -f2) npx playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
      - name: logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 200
      - name: stop
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
