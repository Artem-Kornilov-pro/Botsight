openapi: 3.1.0
info:
  title: Botsight API
  version: 0.1.0
  description: |
    API of the Botsight dashboard (Botsight.md, 13.3): accounts and sign-in, projects,
    members, API keys, saved funnels, ad spend and analytics of the bot's events.

    Analytics endpoints take a period `from`, `to` (dates YYYY-MM-DD in `tz`, `to` inclusive,
    or RFC 3339 times; by default the last 30 days) and `tz` (IANA, default UTC). Their
    answers are cached for a minute; the `X-Cache` header is `hit` or `miss`.

    Authentication: the `bs_session` cookie (HttpOnly, SameSite=Lax) set on sign-in.
    Every state-changing request of a signed-in user must send the `X-CSRF-Token`
    header with `csrf_token` from the sign-in response or `GET /v1/account`.
    Request bodies are JSON (`Content-Type: application/json`); unknown fields are rejected.

    Roles in a project: `viewer` reads, `editor` also changes settings, funnels and
    ad spend, `owner` also manages keys, members and deletes the project.
    A project that the account is not a member of answers 404.
servers:
  - url: http://localhost:8080
    description: deploy/docker-compose.yml

tags:
  - name: auth
  - name: account
  - name: projects
  - name: members
  - name: keys
  - name: funnels
  - name: ad-spend
  - name: analytics
  - name: ai
  - name: antifraud
  - name: health

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      security: []
      responses:
        "200": { description: The process is alive }
  /readyz:
    get:
      tags: [health]
      summary: Readiness (PostgreSQL and Redis reachable, not shutting down)
      security: []
      responses:
        "200": { description: Ready }
        "503": { $ref: "#/components/responses/Error" }

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Register with email and password and sign in
      description: Sends an email confirmation link. Limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 128 }
                name: { type: string, maxLength: 100 }
      responses:
        "201": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { description: "`email_taken`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      description: Limited per IP and per account. Unknown email and wrong password give the same answer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: "`invalid_credentials`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/telegram:
    post:
      tags: [auth]
      summary: Sign in with the Telegram Login Widget
      description: |
        The body is the widget's data as received (`id`, `first_name`, `last_name`, `username`,
        `photo_url`, `auth_date`, `hash`); every field takes part in the signature.
        Creates an account on the first sign-in. Data older than 24 hours is rejected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramAuth" }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "401": { description: "`invalid_telegram_auth`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`telegram_disabled`: TELEGRAM_BOT_TOKEN is not set", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/password-reset:
    post:
      tags: [auth]
      summary: Email a password reset link (valid 1 hour)
      description: Always 202, whether or not the email is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Accepted }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Set a new password with the token from the link
      description: Ends every session of the account and confirms its email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Password changed }
        "400": { description: "`validation_failed` or `invalid_token`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/auth/verify-email:
    post:
      tags: [auth]
      summary: Confirm the email with the token from the link (valid 48 hours)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string }
      responses:
        "204": { description: Email confirmed }
        "400": { description: "`invalid_token`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/account:
    get:
      tags: [account]
      summary: The signed-in account and the CSRF token of the session
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [account]
      summary: Change the display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/account/password:
    post:
      tags: [account]
      summary: Change the password; ends every other session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Changed }
        "400": { description: "`validation_failed` or `wrong_password`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "`no_password`: a Telegram-only account", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/account/verify-email:
    post:
      tags: [account]
      summary: Send the email confirmation link again
      responses:
        "202": { description: Accepted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "`already_verified` or `no_email`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/account/telegram:
    post:
      tags: [account]
      summary: Link a Telegram account to sign in with it too
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramAuth" }
      responses:
        "200": { description: Linked, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "401": { description: "`unauthorized` or `invalid_telegram_auth`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "`telegram_disabled`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`telegram_taken`: linked to another account", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/account/sessions:
    delete:
      tags: [account]
      summary: End every session except the current one
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/projects:
    get:
      tags: [projects]
      summary: Projects the account is a member of
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [projects]
      summary: Create a project with its first API key
      description: The creator becomes the owner. `api_key.key` is shown only in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [project, api_key]
                properties:
                  project: { $ref: "#/components/schemas/Project" }
                  api_key: { $ref: "#/components/schemas/NewAPIKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/projects/{projectID}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [projects]
      summary: A project (any member)
      responses:
        "200": { description: Project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      summary: Rename and/or replace settings (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                settings: { $ref: "#/components/schemas/ProjectSettings" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [projects]
      summary: Delete the project and all its data (owner)
      description: Active keys are announced as revoked to collectors.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{projectID}/members:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [members]
      summary: Members (any member)
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/Member" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [members]
      summary: Add a registered account by email (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "`not_found` (project) or `account_not_found`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`already_member`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/projects/{projectID}/members/{accountID}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { name: accountID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    patch:
      tags: [members]
      summary: Change a role (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200": { description: Changed, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LastOwner" }
    delete:
      tags: [members]
      summary: Remove a member (owner) or leave the project (yourself)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LastOwner" }

  /v1/projects/{projectID}/keys:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [keys]
      summary: API keys without secrets (any member)
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [keys]
      summary: Create a key (owner); the body is optional
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "201": { description: Created; `key` is shown only here, content: { application/json: { schema: { $ref: "#/components/schemas/NewAPIKey" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectID}/keys/{keyID}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { name: keyID, in: path, required: true, schema: { type: integer, minimum: 1 } }
    delete:
      tags: [keys]
      summary: Revoke a key (owner); repeating is a no-op
      description: The prefix is published to Redis `keys:revoked` for collectors.
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{projectID}/funnels:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [funnels]
      summary: Saved funnels (any member)
      responses:
        "200":
          description: Funnels
          content:
            application/json:
              schema:
                type: object
                required: [funnels]
                properties:
                  funnels: { type: array, items: { $ref: "#/components/schemas/Funnel" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [funnels]
      summary: Save a funnel (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FunnelInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Funnel" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectID}/funnels/{funnelID}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { name: funnelID, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [funnels]
      summary: A funnel (any member)
      responses:
        "200": { description: Funnel, content: { application/json: { schema: { $ref: "#/components/schemas/Funnel" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [funnels]
      summary: Replace a funnel (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FunnelInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Funnel" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [funnels]
      summary: Delete a funnel (editor)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{projectID}/ad-spend:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [ad-spend]
      summary: Ad spend whose period intersects [from, to] (any member)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Spend
          content:
            application/json:
              schema:
                type: object
                required: [ad_spend]
                properties:
                  ad_spend: { type: array, items: { $ref: "#/components/schemas/AdSpend" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [ad-spend]
      summary: Add spend on a source over whole days (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, from, to, amount_rub]
              additionalProperties: false
              properties:
                source: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$", description: Deep link label }
                from: { type: string, format: date }
                to: { type: string, format: date, description: Inclusive; at most 366 days after from }
                amount_rub: { type: number, minimum: 0, multipleOf: 0.01 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AdSpend" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`period_overlap`: the source already has spend on some of these days", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/projects/{projectID}/ad-spend/{spendID}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { name: spendID, in: path, required: true, schema: { type: integer, minimum: 1 } }
    delete:
      tags: [ad-spend]
      summary: Delete spend (editor)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{projectID}/overview:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [analytics]
      summary: Audience, blocks, errors and handler time by day (any member)
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/TZ" }
      responses:
        "200":
          description: Totals of the period and a series with every day of it
          headers: { X-Cache: { $ref: "#/components/headers/XCache" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/TooHeavy" }
        "503": { $ref: "#/components/responses/AnalyticsOff" }

  /v1/projects/{projectID}/fsm-graph:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [analytics]
      summary: Scenario graph from FSM transitions and retries on steps (any member)
      description: |
        The state "" is the entry (no state yet) and the exit (state cleared). Handlers that
        failed are not transitions. Retries skip the project's `neutral_handlers`.
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/TZ" }
      responses:
        "200":
          description: Graph
          headers: { X-Cache: { $ref: "#/components/headers/XCache" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Graph" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/TooHeavy" }
        "503": { $ref: "#/components/responses/AnalyticsOff" }

  /v1/projects/{projectID}/funnels/query:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    post:
      tags: [analytics]
      summary: Compute a funnel by its definition (any member)
      description: |
        Users who made the steps in this order within the window (ClickHouse `windowFunnel`).
        With `breakdown: source` also per first deep link label of the users.
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/TZ" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              additionalProperties: false
              properties:
                definition: { $ref: "#/components/schemas/FunnelDefinition" }
      responses:
        "200":
          description: Users per step
          headers: { X-Cache: { $ref: "#/components/headers/XCache" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunnelResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/TooHeavy" }
        "503": { $ref: "#/components/responses/AnalyticsOff" }

  /v1/projects/{projectID}/sources:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [analytics]
      summary: Traffic sources by first touch, conversion and cost of a user (any member)
      description: |
        Users whose first /start came in the period, by its deep link label. Conversion counts
        the goal at any time since the start of the period. Spend from ad-spend is counted
        in proportion to the days of the period; sources with spend and no users are listed too.
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/TZ" }
        - { name: goal, in: query, schema: { type: string }, example: "custom:purchase", description: "kind:value of a funnel step" }
      responses:
        "200":
          description: Sources, the largest first
          headers: { X-Cache: { $ref: "#/components/headers/XCache" } }
          content:
            application/json:
              schema:
                type: object
                required: [range, goal, sources]
                properties:
                  range: { $ref: "#/components/schemas/Range" }
                  goal: { oneOf: [{ $ref: "#/components/schemas/FunnelStep" }, { type: "null" }] }
                  sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/TooHeavy" }
        "503": { $ref: "#/components/responses/AnalyticsOff" }

  /v1/projects/{projectID}/retention:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [analytics]
      summary: Weekly cohorts by the first update (any member)
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 26, default: 8 }, description: Cohorts of the last weeks, the current one included }
        - { $ref: "#/components/parameters/TZ" }
      responses:
        "200":
          description: Cohorts, the oldest first
          headers: { X-Cache: { $ref: "#/components/headers/XCache" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retention" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/TooHeavy" }
        "503": { $ref: "#/components/responses/AnalyticsOff" }

  /v1/projects/{projectID}/errors:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [analytics]
      summary: Handler exceptions, Bot API errors, slow handlers, unhandled updates (any member)
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/TZ" }
      responses:
        "200":
          description: Errors, the most frequent first
          headers: { X-Cache: { $ref: "#/components/headers/XCache" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Errors" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/TooHeavy" }
        "503": { $ref: "#/components/responses/AnalyticsOff" }

  /v1/projects/{projectID}/users/{userID}/timeline:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { name: userID, in: path, required: true, schema: { type: string, pattern: "^[1-9][0-9]*$" }, description: Telegram user id or its pseudonym }
    get:
      tags: [analytics]
      summary: Events of one user, newest first (any member)
      description: Bot API requests are matched by the private chat with the user. One page looks 90 days back from its cursor.
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: next_cursor of the previous page }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/TimelineEvent" } }
                  next_cursor: { type: string, description: Absent on the last page }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AnalyticsOff" }

  /v1/projects/{projectID}/topics:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [ai]
      summary: Topics of user messages with trends (any member)
      description: Built hourly by ai-worker for projects with capture_text (Botsight.md, 14.1).
      responses:
        "200":
          description: Topics, the biggest first
          content:
            application/json:
              schema:
                type: object
                required: [topics]
                properties:
                  topics: { type: array, items: { $ref: "#/components/schemas/Topic" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "`analytics_unavailable`: ClickHouse is not configured", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/projects/{projectID}/topics/{topicID}/examples:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { name: topicID, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [ai]
      summary: Typical messages of a topic (any member); texts are personal data
      responses:
        "200":
          description: Up to 20 messages nearest to the topic centre
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      required: [event_id, ts, text]
                      properties:
                        event_id: { type: string, format: uuid }
                        ts: { type: string, format: date-time }
                        text: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "`analytics_unavailable`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/projects/{projectID}/alerts:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [ai]
      summary: Topic trends and anomalies, newest first (any member)
      responses:
        "200":
          description: Up to 100 alerts
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts: { type: array, items: { $ref: "#/components/schemas/Alert" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "`analytics_unavailable`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/projects/{projectID}/ask:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    post:
      tags: [ai]
      summary: A question in natural language; returns the data and the SQL (any member)
      description: |
        The LLM writes SQL that runs as a read-only ClickHouse user limited to the project's
        rows (Botsight.md, 14.2). Limited per account (30 per hour).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              additionalProperties: false
              properties:
                question: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Answer" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`invalid_sql` (the LLM wrote an unsafe or wrong query) or `query_failed`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: "`llm_error` or `ai_unavailable`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`llm_disabled` or `ai_unavailable`: no LLM or ai-worker configured", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /v1/projects/{projectID}/antifraud:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [antifraud]
      summary: Share of suspicious users per traffic source, last 24 hours (any member)
      description: Results of the latest scoring run of the antifraud service (Botsight.md, 15), updated every minute.
      responses:
        "200":
          description: Sources, the most suspicious first; updated_at is null before the first run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AntifraudSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "`analytics_unavailable`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/projects/{projectID}/antifraud/users:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [antifraud]
      summary: Suspicious users of the latest run (any member)
      parameters:
        - { name: source, in: query, schema: { type: string }, description: "Only this source; empty string means users without a label" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Users, the highest score first
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/SuspiciousUser" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "`analytics_unavailable`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

security:
  - session: []

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: bs_session

  parameters:
    ProjectID:
      name: projectID
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    From:
      name: from
      in: query
      schema: { type: string }
      description: "Start: a date YYYY-MM-DD in tz or an RFC 3339 time; default 29 days before to"
    To:
      name: to
      in: query
      schema: { type: string }
      description: "End: a date YYYY-MM-DD in tz (inclusive) or an RFC 3339 time (exclusive); default now"
    TZ:
      name: tz
      in: query
      schema: { type: string, default: UTC }
      example: Europe/Moscow
      description: IANA time zone of dates and days

  headers:
    XCache:
      schema: { type: string, enum: [hit, miss] }
      description: Whether the answer came from the one-minute cache

  responses:
    TooHeavy:
      description: "`query_too_heavy`: the query hit the ClickHouse limits; narrow the period"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AnalyticsOff:
      description: "`analytics_unavailable`: no ClickHouse configured"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SignedIn:
      description: The account and the CSRF token; sign-in endpoints also set the `bs_session` cookie
      content:
        application/json:
          schema:
            type: object
            required: [account, csrf_token]
            properties:
              account: { $ref: "#/components/schemas/Account" }
              csrf_token: { type: string, description: Send in X-CSRF-Token on state-changing requests }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`unauthorized`: no session or it expired"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`csrf_failed` or `forbidden` (role too low)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`; also for projects the account is not a member of"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LastOwner:
      description: "`last_owner`: a project must keep at least one owner"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited`; see Retry-After"
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine code; the dashboard maps it to a message
              enum: [invalid_json, validation_failed, unsupported_media_type, unauthorized, csrf_failed, forbidden,
                     not_found, method_not_allowed, rate_limited, internal, unavailable, email_taken,
                     invalid_credentials, wrong_password, no_password, no_email, already_verified, invalid_token,
                     telegram_disabled, invalid_telegram_auth, telegram_taken, account_not_found, already_member,
                     last_owner, period_overlap, analytics_unavailable, ai_unavailable, invalid_sql,
                     query_failed, llm_error, llm_disabled, invalid_question, query_too_heavy]
            message: { type: string }
            field: { type: string, description: The invalid field for validation_failed }

    Account:
      type: object
      required: [id, email, email_verified, has_password, telegram, name, created_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: [string, "null"], format: email }
        email_verified: { type: boolean }
        has_password: { type: boolean }
        telegram:
          type: [object, "null"]
          required: [id, username]
          properties:
            id: { type: integer, format: int64 }
            username: { type: [string, "null"] }
        name: { type: string }
        created_at: { type: string, format: date-time }

    TelegramAuth:
      type: object
      required: [id, auth_date, hash]
      additionalProperties: { type: [string, number] }
      properties:
        id: { type: integer, format: int64 }
        first_name: { type: string }
        last_name: { type: string }
        username: { type: string }
        photo_url: { type: string }
        auth_date: { type: integer, description: Unix time }
        hash: { type: string }

    Role:
      type: string
      enum: [owner, editor, viewer]

    ProjectSettings:
      type: object
      required: [capture_text, neutral_handlers]
      additionalProperties: false
      properties:
        capture_text: { type: boolean, description: Accept message texts for AI topics (Botsight.md, 14) }
        neutral_handlers:
          type: array
          maxItems: 100
          description: Handlers ('module:qualname') that do not count as a retry on a step (Botsight.md, 13.1)
          items: { type: string, maxLength: 200 }

    Project:
      type: object
      required: [id, name, bot_id, plan, settings, role, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        bot_id: { type: [integer, "null"], format: int64, description: Filled by the first event }
        plan: { type: string }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }

    Member:
      type: object
      required: [account_id, email, telegram_username, name, role, added_at]
      properties:
        account_id: { type: integer, format: int64 }
        email: { type: [string, "null"] }
        telegram_username: { type: [string, "null"] }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        added_at: { type: string, format: date-time }

    APIKey:
      type: object
      required: [id, prefix, name, created_at, revoked_at]
      properties:
        id: { type: integer }
        prefix: { type: string, example: bs_live_ab12cd34 }
        name: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }

    NewAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key: { type: string, description: The full key; shown once, store it in BOTSIGHT_KEY }

    FunnelStep:
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [command, callback_data, state, custom] }
        value: { type: string, minLength: 1, maxLength: 256, description: "Command without '/', callback_data, FSM state or manual event name" }

    FunnelDefinition:
      type: object
      required: [steps]
      additionalProperties: false
      properties:
        steps: { type: array, minItems: 2, maxItems: 20, items: { $ref: "#/components/schemas/FunnelStep" } }
        window_seconds: { type: integer, minimum: 60, maximum: 2592000, default: 86400 }
        breakdown: { type: string, enum: ["", source], default: "" }

    FunnelInput:
      type: object
      required: [name, definition]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        definition: { $ref: "#/components/schemas/FunnelDefinition" }

    Funnel:
      type: object
      required: [id, name, definition, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        definition: { $ref: "#/components/schemas/FunnelDefinition" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Range:
      type: object
      required: [from, to, tz]
      description: The period used, after defaults and rounding to minutes
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        tz: { type: string }

    Quantiles:
      type: object
      required: [p50, p95, p99]
      properties:
        p50: { type: number }
        p95: { type: number }
        p99: { type: number }

    Overview:
      type: object
      required: [range, users, new_users, wau, mau, blocked, updates, unhandled, handler_errors, api_errors, handler_ms, days, deploys]
      properties:
        range: { $ref: "#/components/schemas/Range" }
        users: { type: integer, description: Users with at least one update in the period }
        new_users: { type: integer, description: Users whose first update ever is in the period }
        wau: { type: integer, description: 7 days before the end of the period }
        mau: { type: integer, description: 30 days before the end of the period }
        blocked: { type: integer, description: "Users who blocked the bot: 403 bot_blocked or my_chat_member kicked" }
        updates: { type: integer }
        unhandled: { type: integer }
        handler_errors: { type: integer }
        api_errors: { type: integer }
        handler_ms: { $ref: "#/components/schemas/Quantiles" }
        days:
          type: array
          description: Every day of the period, zeros included
          items:
            type: object
            required: [day, dau, new_users, blocked, updates, unhandled, handler_errors, api_errors]
            properties:
              day: { type: string, format: date }
              dau: { type: integer }
              new_users: { type: integer }
              blocked: { type: integer }
              updates: { type: integer }
              unhandled: { type: integer }
              handler_errors: { type: integer }
              api_errors: { type: integer }
        deploys:
          type: array
          description: Bot starts, marks on the charts
          items:
            type: object
            required: [ts, sdk_version, framework, framework_version]
            properties:
              ts: { type: string, format: date-time }
              sdk_version: { type: string }
              framework: { type: string }
              framework_version: { type: string }

    Graph:
      type: object
      required: [range, nodes, edges, retries]
      properties:
        range: { $ref: "#/components/schemas/Range" }
        nodes:
          type: array
          items:
            type: object
            required: [state, in, out]
            properties:
              state: { type: string }
              in: { type: integer }
              out: { type: integer }
        edges:
          type: array
          items:
            type: object
            required: [from, to, transitions, users, share]
            properties:
              from: { type: string }
              to: { type: string }
              transitions: { type: integer }
              users: { type: integer }
              share: { type: number, description: Of the users who left the from state }
        retries:
          type: array
          items:
            type: object
            required: [state, retries, users]
            properties:
              state: { type: string }
              retries: { type: integer }
              users: { type: integer }

    FunnelStepResult:
      type: object
      required: [step, users, from_prev, from_first]
      properties:
        step: { $ref: "#/components/schemas/FunnelStep" }
        users: { type: integer }
        from_prev: { type: number }
        from_first: { type: number }

    FunnelResult:
      type: object
      required: [range, steps]
      properties:
        range: { $ref: "#/components/schemas/Range" }
        steps: { type: array, items: { $ref: "#/components/schemas/FunnelStepResult" } }
        breakdown:
          type: array
          description: With breakdown source; up to 50 sources, the largest first
          items:
            type: object
            required: [source, steps]
            properties:
              source: { type: string }
              steps: { type: array, items: { $ref: "#/components/schemas/FunnelStepResult" } }

    Source:
      type: object
      required: [source, users, converted, conversion, blocked, block_rate, spend_rub, cost_per_user_rub, cost_per_conversion_rub]
      properties:
        source: { type: string, description: '"" for /start without a label' }
        users: { type: integer }
        converted: { type: integer }
        conversion: { type: number }
        blocked: { type: integer }
        block_rate: { type: number }
        spend_rub: { type: ["number", "null"] }
        cost_per_user_rub: { type: ["number", "null"] }
        cost_per_conversion_rub: { type: ["number", "null"] }

    Retention:
      type: object
      required: [weeks, tz, cohorts]
      properties:
        weeks: { type: integer }
        tz: { type: string }
        cohorts:
          type: array
          items:
            type: object
            required: [week, users, active, share]
            properties:
              week: { type: string, format: date, description: Monday of the cohort }
              users: { type: integer }
              active: { type: array, items: { type: integer }, description: "Index 0 is the cohort week; weeks not begun yet are left out" }
              share: { type: array, items: { type: number } }

    Errors:
      type: object
      required: [range, handlers, api, rate_limited, slow, unhandled]
      properties:
        range: { $ref: "#/components/schemas/Range" }
        handlers:
          type: array
          items:
            type: object
            required: [handler, error, count, users, last_seen]
            properties:
              handler: { type: string }
              error: { type: string }
              count: { type: integer }
              users: { type: integer }
              last_seen: { type: string, format: date-time }
        api:
          type: array
          items:
            type: object
            required: [method, code, error, count, chats, last_seen]
            properties:
              method: { type: string }
              code: { type: integer }
              error: { type: string }
              count: { type: integer }
              chats: { type: integer }
              last_seen: { type: string, format: date-time }
        rate_limited: { type: integer, description: Bot API answers 429 }
        slow:
          type: array
          description: Handlers with at least 5 calls, the slowest p95 first
          items:
            type: object
            required: [handler, calls, ms, max_ms]
            properties:
              handler: { type: string }
              calls: { type: integer }
              ms: { $ref: "#/components/schemas/Quantiles" }
              max_ms: { type: integer }
        unhandled:
          type: array
          items:
            type: object
            required: [name, content_type, count, users]
            properties:
              name: { type: string }
              content_type: { type: string }
              count: { type: integer }
              users: { type: integer }

    TimelineEvent:
      type: object
      required: [event_id, ts, type, name, handled, ok, duration_ms]
      description: Empty fields are omitted
      properties:
        event_id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        type: { type: string, enum: [update, step, outgoing, custom, lifecycle] }
        name: { type: string }
        chat_id: { type: integer }
        content_type: { type: string }
        command: { type: string }
        start_param: { type: string }
        callback_data: { type: string }
        state: { type: string }
        handler: { type: string }
        state_from: { type: string }
        state_to: { type: string }
        member_status: { type: string }
        handled: { type: boolean }
        ok: { type: boolean }
        duration_ms: { type: integer }
        error_code: { type: integer }
        error: { type: string }
        props_str: { type: object, additionalProperties: { type: string } }
        props_num: { type: object, additionalProperties: { type: number } }

    AdSpend:
      type: object
      required: [id, source, from, to, amount_rub, created_at]
      properties:
        id: { type: integer }
        source: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        amount_rub: { type: number }
        created_at: { type: string, format: date-time }

    Topic:
      type: object
      required: [id, name, description, keywords, unique_texts, messages_7d, messages_prev_7d, share_7d, share_prev_7d, growth, named_by, updated_at]
      properties:
        id: { type: integer }
        name: { type: string, description: Named by the LLM or by keywords }
        description: { type: string }
        keywords: { type: array, items: { type: string } }
        unique_texts: { type: integer }
        messages_7d: { type: integer }
        messages_prev_7d: { type: integer }
        share_7d: { type: number, description: Share of all messages in the last 7 days }
        share_prev_7d: { type: number }
        growth: { type: number, description: share_7d / share_prev_7d; 0 when there is not enough history }
        named_by: { type: string, enum: [llm, keywords] }
        updated_at: { type: string, format: date-time }

    Alert:
      type: object
      required: [id, kind, created_at, title, text, details]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [topic_trend, anomaly, fraud] }
        created_at: { type: string, format: date-time }
        title: { type: string }
        text: { type: string }
        details: { type: object, description: Facts behind the alert }

    Answer:
      type: object
      required: [question, title, chart, sql, columns, rows, truncated]
      properties:
        question: { type: string }
        title: { type: string }
        chart: { type: string, enum: [number, line, bar, table] }
        sql: { type: string, description: The query that produced the data }
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array, items: {} } }
        truncated: { type: boolean, description: More than 1000 rows }

    AntifraudReasons:
      type: object
      description: Suspicious users per reason
      additionalProperties: { type: integer }
      example: { fast_steps: 38, synced_timing: 37 }

    AntifraudSummary:
      type: object
      required: [updated_at, window_hours, threshold, users, suspicious, sources, reason_texts]
      properties:
        updated_at: { type: [string, "null"], format: date-time }
        window_hours: { type: integer }
        threshold: { type: number, description: A user is suspicious from this score }
        users: { type: integer }
        suspicious: { type: integer }
        sources:
          type: array
          items:
            type: object
            required: [source, users, suspicious, share, avg_score, reasons]
            properties:
              source: { type: string, description: "Deep link label; empty for users without one" }
              users: { type: integer }
              suspicious: { type: integer }
              share: { type: number }
              avg_score: { type: number }
              reasons: { $ref: "#/components/schemas/AntifraudReasons" }
        reason_texts:
          type: object
          additionalProperties: { type: string }
          description: "Reason codes: fast_steps, synced_timing, referral_ring, homogeneous_source, fresh_accounts, start_spike"

    SuspiciousUser:
      type: object
      required: [user_id, source, joined, score, reasons]
      properties:
        user_id: { type: string, description: A string because pseudonymized ids exceed 2^53 }
        source: { type: string }
        joined: { type: string, format: date-time }
        score: { type: number, minimum: 0, maximum: 1 }
        reasons: { type: array, items: { type: string } }
