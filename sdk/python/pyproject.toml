[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "botsight"
dynamic = ["version"]
description = "Analytics for Telegram bots in two lines of code (aiogram 3 SDK)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Artem Kornilov" }]
keywords = ["telegram", "bot", "aiogram", "analytics"]
classifiers = [
    "Framework :: AsyncIO",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = ["aiogram>=3.10,<4"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/Artem-Kornilov-pro/Botsight"
Issues = "https://github.com/Artem-Kornilov-pro/Botsight/issues"

[tool.hatch.version]
path = "src/botsight/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/botsight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["benchmark: hot-path overhead benchmark (run separately in CI)"]
addopts = "-m 'not benchmark'"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
# Russian text in strings and comments is expected
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
