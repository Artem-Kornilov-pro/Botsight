# Prometheus of the local stack (Botsight.md, 17): every service exposes /metrics.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8080"] }]
  - job_name: collector
    static_configs: [{ targets: ["collector:8081"] }]
  - job_name: chwriter
    static_configs: [{ targets: ["chwriter:8082"] }]
  - job_name: antifraud
    static_configs: [{ targets: ["antifraud:8083"] }]
  - job_name: botproxy
    static_configs: [{ targets: ["botproxy:8084"] }]
  - job_name: ai-worker
    static_configs: [{ targets: ["ai-worker:8090"] }]
